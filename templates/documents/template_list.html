{% extends "base.html" %}

{% block content %}
<h1>DOCX Templates</h1>

<a href="{% url 'documents:template_upload' %}">Upload new template</a>

<table>
    <thead>
        <tr>
            <th>Title</th>
            <th>Variables</th>
            <th>Created</th>
        </tr>
    </thead>
    <tbody>
        {% for template in templates %}
            <tr>
                <td>{{ template.title }}</td>
                <td>{{ template.variables|join:", " }}</td>
                <td>{{ template.created_at }}</td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="3">No templates yet.</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
