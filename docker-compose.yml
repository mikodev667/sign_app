services:
  postgres:
    image: postgres:16-alpine
    container_name: sign_app_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sign_app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sign_app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: sign_app_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-signappminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-signappminio123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9002}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: sign_app_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-signappminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-signappminio123}
      MINIO_BUCKET: ${MINIO_BUCKET:-sign-app-documents}
      MINIO_DEFAULT_RETENTION_DAYS: ${MINIO_DEFAULT_RETENTION_DAYS:-30}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing --with-lock local/$$MINIO_BUCKET &&
      mc version enable local/$$MINIO_BUCKET &&
      mc retention set --default COMPLIANCE $${MINIO_DEFAULT_RETENTION_DAYS}d local/$$MINIO_BUCKET
      "

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: sign_app_onlyoffice
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-sign-app-onlyoffice-secret}
      JWT_HEADER: ${ONLYOFFICE_JWT_HEADER:-Authorization}
      JWT_IN_BODY: "true"
    ports:
      - "${ONLYOFFICE_PORT:-8082}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_lib:/var/lib/onlyoffice
      - onlyoffice_db:/var/lib/postgresql

  admissions-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sign_app_admissions_mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-ChangeMe_Mssql2026!}
      MSSQL_DB: ${ADMISSIONS_MSSQL_NAME:-sign_app_admissions}
      MSSQL_USER: ${ADMISSIONS_MSSQL_USER:-sign_app_admissions}
      MSSQL_PASSWORD: ${ADMISSIONS_MSSQL_PASSWORD:-ChangeMe_Mssql2026!}
    ports:
      - "127.0.0.1:${MSSQL_HOST_PORT:-14330}:1433"
    volumes:
      - admissions_mssql_data:/var/opt/mssql

volumes:
  postgres_data:
  minio_data:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_lib:
  onlyoffice_db:
  admissions_mssql_data:
